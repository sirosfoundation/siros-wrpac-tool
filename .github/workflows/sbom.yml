# Software bill of materials, via the shared sirosfoundation workflow.
#
# Runs on main only. Releases get their SBOM from release.yml, which calls the
# same shared workflow after publishing: a release created with GITHUB_TOKEN
# does not raise the `release` event, so a trigger here would never fire.
name: SBOM

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sbom:
    uses: sirosfoundation/.github/.github/workflows/sbom.yml@main
    permissions:
      contents: write        # attach the SBOM to a release
      id-token: write        # Cosign keyless signing
      security-events: write # SARIF upload — required by the reusable workflow
