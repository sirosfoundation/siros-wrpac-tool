# SonarCloud code quality and security analysis.
name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install SoftHSM and OpenSC
        run: sudo apt-get update && sudo apt-get install -y softhsm2 opensc

      # The softhsm tag is required: without it the PKCS#11 paths are excluded
      # from the build and Sonar reports them as uncovered.
      - name: Generate coverage report
        run: go test -tags softhsm -coverprofile=coverage.out ./...

      - name: SonarCloud Scan
        # Pinned by hash, not by tag: GHSA-f79p-9c5r-xg88 (command injection,
        # fixed in 5.3.1) and GHSA-5xq9-5g24-4g6f (argument injection, fixed in
        # 6.0.0) both affect the v5 line, and a moving tag would let a
        # compromised release replace this without the reference changing.
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
